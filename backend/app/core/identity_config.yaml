# ─── Identity Matching Config (Stage 2) ──────────────────────────────────────────
# Configuration for deterministic face embedding cosine similarity and
# registry velocity checks (6-hour window).
#
# Thresholds empirically calibrated via MTCNN + InceptionResnetV1 (VGGFace2):
#   - Genuine Cross-Domain (ID Card vs Live Webcam): 0.68 – 0.95 (mean: ~0.78)
#   - Impostor Pairs (Different identities):        0.01 – 0.31 (mean: ~0.22)
#   - Biometric Decision Cutoffs:
#       FAIL:       cosine_similarity < 0.35
#       BORDERLINE: 0.35 <= cosine_similarity < 0.55
#       PASS:       cosine_similarity >= 0.55
#   - Registry Velocity (6hr):
#       FAIL:       registry_velocity >= 6
#       BORDERLINE: 3 <= registry_velocity < 6
#       PASS:       registry_velocity < 3
# ─────────────────────────────────────────────────────────────────────────────

config_version: "v2.0-mtcnn-inception"

thresholds:
  similarity_pass: 0.55         # cosine_similarity >= 0.55 -> MATCH (empirical biometric pass cutoff)
  similarity_fail: 0.35         # cosine_similarity < 0.35 -> NO_MATCH (hard fail cutoff)
  fuzzy_name_min_ratio: 70      # minimum fuzzy match score for name verification
  fuzzy_dob_min_ratio: 80       # minimum fuzzy match score for date of birth verification
  velocity_borderline: 3        # registry_velocity >= 3 -> borderline tier
  velocity_fail: 6              # registry_velocity >= 6 -> fail tier

embedding:
  dimension: 512
  backbone: "mtcnn_inception_resnet_v1_vggface2_512d"

synthetic_data_path: "data/onboarding_batch.json"

